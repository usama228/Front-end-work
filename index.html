<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>U DEVS | Login & Signup</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <span class="particle p1"></span>
        <span class="particle p2"></span>
        <span class="particle p3"></span>
        <span class="particle p4"></span>
        <span class="particle p5"></span>
    </div>


    <!-- Main -->
    <main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center position-relative">

        <div class="auth-card">

            <!-- Logo -->
            <div class="text-center logo-section">

                <div class="logo">
                    U
                </div>

                <h3 class="brand-name">U DEVS</h3>

                <p class="brand-tagline">
                    Build. Innovate. Scale.
                </p>

            </div>


            <!-- Forms Container -->
            <div class="form-wrapper">

                <!-- ================= LOGIN ================= -->

                <form id="loginForm" class="auth-form login-form">

                    <div class="text-center mb-4">
                        <h1>Welcome Back</h1>

                        <p>
                            Sign in to continue to your account
                        </p>
                    </div>


                    <!-- Email -->
                    <div class="form-floating mb-3">

                        <input
                            type="email"
                            class="form-control custom-input"
                            id="loginEmail"
                            placeholder="Email"
                            required
                        >

                        <label for="loginEmail">
                            <i class="bi bi-envelope me-2"></i>
                            Email Address
                        </label>

                    </div>


                    <!-- Password -->
                    <div class="form-floating mb-3">

                        <input
                            type="password"
                            class="form-control custom-input"
                            id="loginPassword"
                            placeholder="Password"
                            required
                        >

                        <label for="loginPassword">
                            <i class="bi bi-lock me-2"></i>
                            Password
                        </label>

                    </div>


                    <!-- Options -->
                    <div class="d-flex justify-content-between align-items-center mb-4">

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="remember"
                            >

                            <label
                                class="form-check-label small text-white-50"
                                for="remember"
                            >
                                Remember me
                            </label>

                        </div>

                        <a href="#" class="forgot-link">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="btn btn-primary w-100 auth-btn"
                    >
                        Sign In
                        <i class="bi bi-arrow-right ms-2"></i>
                    </button>


                    <!-- Divider -->
                    <div class="divider my-4">
                        <span>OR</span>
                    </div>


                    <!-- Google -->
                    <button
                        type="button"
                        class="btn google-btn w-100"
                    >
                        <i class="bi bi-google me-2"></i>
                        Continue with Google
                    </button>


                    <!-- Switch -->
                    <p class="text-center switch-text mt-4 mb-0">

                        Don't have an account?

                        <button
                            type="button"
                            class="switch-btn"
                            id="showSignup"
                        >
                            Create Account
                        </button>

                    </p>

                </form>


                <!-- ================= SIGNUP ================= -->

                <form id="signupForm" class="auth-form signup-form">

                    <div class="text-center mb-4">

                        <h1>Create Account</h1>

                        <p>
                            Start your journey with U DEVS
                        </p>

                    </div>


                    <!-- Name -->
                    <div class="form-floating mb-3">

                        <input
                            type="text"
                            class="form-control custom-input"
                            id="fullName"
                            placeholder="Full Name"
                            required
                        >

                        <label for="fullName">
                            <i class="bi bi-person me-2"></i>
                            Full Name
                        </label>

                    </div>


                    <!-- Email -->
                    <div class="form-floating mb-3">

                        <input
                            type="email"
                            class="form-control custom-input"
                            id="signupEmail"
                            placeholder="Email"
                            required
                        >

                        <label for="signupEmail">
                            <i class="bi bi-envelope me-2"></i>
                            Email Address
                        </label>

                    </div>


                    <!-- Password -->
                    <div class="form-floating mb-3">

                        <input
                            type="password"
                            class="form-control custom-input"
                            id="signupPassword"
                            placeholder="Password"
                            required
                        >

                        <label for="signupPassword">
                            <i class="bi bi-lock me-2"></i>
                            Password
                        </label>

                    </div>


                    <!-- Confirm Password -->
                    <div class="form-floating mb-3">

                        <input
                            type="password"
                            class="form-control custom-input"
                            id="confirmPassword"
                            placeholder="Confirm Password"
                            required
                        >

                        <label for="confirmPassword">
                            <i class="bi bi-shield-lock me-2"></i>
                            Confirm Password
                        </label>

                    </div>


                    <!-- Terms -->
                    <div class="form-check mb-4">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <label
                            class="form-check-label terms-text"
                            for="terms"
                        >
                            I agree to the
                            <a href="#">Terms & Conditions</a>
                        </label>

                    </div>


                    <!-- Signup Button -->
                    <button
                        type="submit"
                        class="btn btn-primary w-100 auth-btn"
                    >
                        Create Account
                        <i class="bi bi-arrow-right ms-2"></i>
                    </button>


                    <!-- Switch -->
                    <p class="text-center switch-text mt-4 mb-0">

                        Already have an account?

                        <button
                            type="button"
                            class="switch-btn"
                            id="showLogin"
                        >
                            Sign In
                        </button>

                    </p>

                </form>

            </div>

        </div>

    </main>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Login / Signup Animation -->
    <script>

        const authCard = document.querySelector(".auth-card");

        const showSignup = document.getElementById("showSignup");
        const showLogin = document.getElementById("showLogin");

        showSignup.addEventListener("click", () => {

            authCard.classList.add("show-signup");

        });

        showLogin.addEventListener("click", () => {

            authCard.classList.remove("show-signup");

        });

    </script>

</body>
</html>
